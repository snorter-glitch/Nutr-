name: Publish Nutrition Evidence Engine v7.2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact validated archive
        shell: bash
        run: |
          cat .bootstrap/final_b64/part_*.txt > /tmp/nutrition-v7.2.tar.xz.b64
          base64 -d /tmp/nutrition-v7.2.tar.xz.b64 > /tmp/nutrition-v7.2.tar.xz
          echo "bd4a26dfabfec98b7035e8e5792997a0d04f44608c8f03272ecbb077ca42425d  /tmp/nutrition-v7.2.tar.xz" | sha256sum -c -
          mkdir -p /tmp/nutrition-v7.2
          tar -xJf /tmp/nutrition-v7.2.tar.xz -C /tmp/nutrition-v7.2
      - name: Verify packaged source
        shell: bash
        run: |
          SRC=/tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2
          test -f "$SRC/SKILL.md"
          test -f "$SRC/metadata.json"
          python "$SRC/scripts/validate_pack.py"
          python "$SRC/scripts/validate_benchmarks.py"
      - name: Publish full source to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/. .
          git add -A
          git commit -m 'Publish Nutrition Evidence Engine v7.2'
          git push origin main
