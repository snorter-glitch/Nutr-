name: Publish Nutrition Evidence Engine v7.2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact v7.2 archive
        shell: bash
        run: |
          cat \
            .bootstrap/final8/part_00_fixed.b64 \
            .bootstrap/final8/part_01.b64 \
            .bootstrap/final8/part_02.b64 \
            .bootstrap/final8/part_03.b64 \
            .bootstrap/final8/part_04.b64 \
            .bootstrap/final8/part_05.b64 \
            .bootstrap/final8/part_06.b64 \
            .bootstrap/final8/part_07.b64 \
            > /tmp/final-v7.2.b64
          base64 -d /tmp/final-v7.2.b64 > /tmp/final-v7.2.tar.xz
          echo "48bc28ef2411e29162277ccacae3ae0d31aadec3e07b3063ae4bfc4039b41aa3  /tmp/final-v7.2.tar.xz" | sha256sum -c -

      - name: Extract final v7.2
        shell: bash
        run: |
          mkdir -p /tmp/nutrition-v7.2
          tar -xJf /tmp/final-v7.2.tar.xz -C /tmp/nutrition-v7.2

      - name: Verify packaged source
        shell: bash
        run: |
          SRC=/tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2
          test -f "$SRC/SKILL.md"
          test -f "$SRC/metadata.json"
          cd "$SRC"
          python scripts/validate_pack.py
          python scripts/validate_benchmarks.py

      - name: Publish exact source to main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Nutrition Evidence Engine v7.2'
          git push origin main
