name: Publish Nutrition Evidence Engine v7.2

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract final source archive
        run: |
          mkdir -p /tmp/nutrition-v7.2
          tar -xJf .bootstrap/final-v7.2.tar.xz -C /tmp/nutrition-v7.2
      - name: Verify packaged source
        run: |
          test -f /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/SKILL.md
          test -f /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/metadata.json
          python /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/scripts/validate_pack.py
          python /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/scripts/validate_benchmarks.py
      - name: Replace repository with full source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/nutrition-v7.2/nutrition-evidence-engine-v7.2/. .
      - name: Commit full v7.2 source to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Nutrition Evidence Engine v7.2'
          git push origin HEAD:main
