name: Publish Nutrition Evidence Engine v7.2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact validated archive
        shell: bash
        run: |
          cat > /tmp/nutrition-v7.2.tar.xz.b64 <<'B64EOF'
